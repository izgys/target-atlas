# Lint + offline tests, and a Docker image build, on every push and pull request.
# No secrets are configured: the tests mock every API and Claude, and the
# test step runs with networking switched off at the OS level.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true          # reuse downloaded wheels between runs

      # --locked fails if uv.lock is out of sync with pyproject.toml, so CI
      # installs exactly the versions that were tested locally.
      # 3.12 matches the local development environment.
      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uv run --no-sync ruff check .

      # `unshare --net` starts pytest in a new network namespace that has only
      # a loopback interface: any real HTTP call fails, whatever the code does.
      # sudo is needed to create the namespace; `sudo -u` drops back to the
      # runner user so the tests don't run as root.
      - name: Test (network off)
        run: |
          sudo unshare --net -- sudo -u "$USER" env -u ANTHROPIC_API_KEY \
            .venv/bin/python -m pytest

  # Builds the image on a clean runner and checks it without an API key.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true                     # make the image available to `docker run` below
          tags: target-atlas:ci
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha           # reuse the dependency layer between runs
          cache-to: type=gha,mode=max

      - name: CLI starts
        run: docker run --rm target-atlas:ci --help

      - name: No .env in the image
        run: |
          docker run --rm --entrypoint sh target-atlas:ci -c \
            'test -z "$(find /app -name ".env*" -not -path "/app/.venv/*")"'

      - name: Runs as a non-root user
        run: test "$(docker run --rm --entrypoint id target-atlas:ci -u)" != "0"

      - name: Config is found inside the image
        run: |
          out=$(docker run --rm target-atlas:ci run EGFR --set agents.reasoning.temprature=0 || true)
          echo "$out"
          echo "$out" | grep -q "Could not override 'agents.reasoning.temprature'"

      - name: Eval records the build commit
        run: |
          docker run --rm --entrypoint python target-atlas:ci \
            -c "from evals.run_eval import _git_commit; print(_git_commit())" | grep -q "${{ github.sha }}"

      # Live UniProt call, no Claude: an unresolvable target must exit with code 1
      - name: Invalid target exits cleanly
        run: |
          set +e
          docker run --rm target-atlas:ci run ZZZZNOTAPROTEIN
          test $? -eq 1
