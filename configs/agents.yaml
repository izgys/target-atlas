# @package agents
#
# LLM settings. Only the reasoning node calls a model.

reasoning:
  model: claude-sonnet-4-6
  # 0 makes Claude pick the most likely token at each step. This reduces
  # run-to-run variation but does NOT guarantee identical outputs from an
  # API model, so evals are reported over repeats (target-atlas eval --repeats 5).
  # null omits the parameter (API default, 1.0).
  temperature: 0
  max_tokens: 2000
