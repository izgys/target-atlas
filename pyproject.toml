[project]
name = "target-atlas"
version = "0.1.0"
description = "LLM workflow for automated protein target analysis"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "langgraph>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "hydra-core>=1.3.0",
    "mlflow>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
target-atlas = "target_atlas.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/target_atlas"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Ruff's default rule set (pyflakes + the pycodestyle errors that catch real bugs).
# Widening to import sorting / bugbear / pyupgrade is a separate, style-only change.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
